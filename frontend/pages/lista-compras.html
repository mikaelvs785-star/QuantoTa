<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lista de Compras - QuantoTá?</title><link rel="stylesheet" href="../css/style.css"></head><body>
