<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - QuantoTá?</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🛒</div>
      <div class="brand-text">
        <h2>QuantoTá?</h2>
        <small>Pesquise preços</small>
      </div>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Início</a>
      <a href="produtos.html" class="active">Produtos</a>
      <a href="comparacao.html">Comparação</a>
      <a href="lista-compras.html">Lista de Compras</a>
      <a href="dashboard.html" data-auth-only style="display:none">Dashboard</a>
      <a href="admin.html" data-nav-admin style="display:none">Admin</a>
      <span class="nav-user" data-user-name>Visitante</span>
      <button id="toggleTema" class="theme-toggle" type="button"></button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="section-title">Buscar produtos</h2>
      <p class="small">Digite banana, arroz, leite, café e encontre onde está mais barato.</p>
      <div id="produtosStatus" hidden></div>
      <div class="search-row">
        <div>
          <label for="busca">Nome do produto</label>
          <input id="busca" placeholder="Digite banana, arroz, leite...">
        </div>
        <div>
          <label for="filtroCategoria">Categoria</label>
          <select id="filtroCategoria">
            <option value="">Todas as categorias</option>
          </select>
        </div>
        <button class="btn" onclick="buscarProdutos()">Buscar</button>
      </div>

      <div>
        <p class="small">Últimas buscas</p>
        <div id="ultimasBuscas" class="recent-searches"></div>
      </div>
    </div>
    <div id="resultadoProdutos" class="grid grid-2"></div>
  </div>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/produtos.js"></script>
</body>
</html>
