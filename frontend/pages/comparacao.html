<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparação - QuantoTá?</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🛒</div>
      <div class="brand-text">
        <h2>QuantoTá?</h2>
        <small>Compare os mercados</small>
      </div>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Início</a>
      <a href="produtos.html">Produtos</a>
      <a href="comparacao.html" class="active">Comparação</a>
      <a href="lista-compras.html">Lista de Compras</a>
      <a href="dashboard.html" data-auth-only style="display:none">Dashboard</a>
      <a href="admin.html" data-nav-admin style="display:none">Admin</a>
      <span class="nav-user" data-user-name>Visitante</span>
      <button id="toggleTema" class="theme-toggle" type="button"></button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2 id="tituloProduto" class="section-title">Comparação</h2>
      <p class="section-subtitle">Veja o ranking de mercados e identifique rapidamente o menor preço.</p>
      <div id="comparacaoStatus" hidden></div>
      <div id="resumoComparacao"></div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Mercado</th>
              <th>Preço</th>
              <th>Data da coleta</th>
              <th>Observação</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="corpoComparacao"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/comparacao.js"></script>
</body>
</html>
