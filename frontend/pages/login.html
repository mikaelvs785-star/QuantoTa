<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QuantoTá?</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🛒</div>
      <div class="brand-text">
        <h2>QuantoTá?</h2>
        <small>Acesse sua conta</small>
      </div>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Início</a>
      <a href="login.html" class="active" data-guest-only>Login</a>
      <a href="cadastro.html" data-guest-only>Cadastro</a>
      <a href="produtos.html">Produtos</a>
      <a href="lista-compras.html">Lista de Compras</a>
      <a href="dashboard.html" data-auth-only style="display:none">Dashboard</a>
      <a href="admin.html" data-nav-admin style="display:none">Admin</a>
      <span class="nav-user" data-user-name>Visitante</span>
      <button id="toggleTema" class="theme-toggle" type="button"></button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="section-title">Login</h2>
      <p class="small">Entre para salvar listas, acompanhar suas comparações e acessar seu painel.</p>
      <div id="authStatus" hidden></div>
      <form onsubmit="fazerLogin(event)">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="seuemail@exemplo.com" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Digite sua senha" required>

        <button class="btn" type="submit">Entrar</button>
      </form>
    </div>
  </div>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
