<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - QuantoTá?</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🛒</div>
      <div class="brand-text">
        <h2>QuantoTá?</h2>
        <small>Crie sua conta</small>
      </div>
    </div>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="login.html">Login</a>
      <a href="cadastro.html" class="active">Cadastro</a>
      <a href="produtos.html">Produtos</a>
      <button id="toggleTema" class="theme-toggle" type="button"></button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="section-title">Criar conta</h2>
      <p class="small">Faça seu cadastro para montar listas e acompanhar preços.</p>
      <form onsubmit="cadastrarUsuario(event)">
        <input id="nome" placeholder="Nome" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="senha" type="password" placeholder="Senha" required>
        <button class="btn" type="submit">Cadastrar</button>
      </form>
    </div>
  </div>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
