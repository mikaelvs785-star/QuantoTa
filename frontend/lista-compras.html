<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras - QuantoTá?</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🛒</div>
      <div class="brand-text">
        <h2>QuantoTá?</h2>
        <small>Sua lista inteligente</small>
      </div>
    </div>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="produtos.html">Produtos</a>
      <a href="comparacao.html">Comparação</a>
      <a href="lista-compras.html" class="active">Lista de Compras</a>
      <button id="toggleTema" class="theme-toggle" type="button"></button>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="section-title">Minha lista de compras</h2>
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Menor preço</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="corpoLista"></tbody>
      </table>
      <h3>Total estimado: <span class="highlight" id="totalEstimado">R$ 0,00</span></h3>
    </div>
  </div>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/lista-compras.js"></script>
</body>
</html>
